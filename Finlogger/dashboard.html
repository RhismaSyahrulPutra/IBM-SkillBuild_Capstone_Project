<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finlogger Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ===================== Header ===================== -->
    <header class="header-section">
      <div class="container-lg">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h1 class="app-title">FinLogger</h1>
          </div>
          <div class="col-md-6 text-end">
            <p class="app-tagline mb-0">Your financial diary!</p>
          </div>
        </div>
      </div>
    </header>

    <main class="container-lg mt-4">
      <!-- ============== Overview Title + Filter ============== -->
      <div class="row align-items-center mb-4">
        <div class="col-md-6">
          <h1 class="overview-title">OVERVIEW</h1>
        </div>
        <div class="col-md-6 text-end">
          <input
            type="month"
            id="monthFilter"
            class="form-control d-inline-block me-2 month-filter"
            value="2020-01"
          />
          <button
            type="button"
            class="btn expButton"
            data-mode="add"
            data-bs-toggle="modal"
            data-bs-target="#expenseModal"
          >
            Add Expense
          </button>
        </div>
      </div>

      <!-- ============== Overview Cards ============== -->
      <div class="row mb-4">
        <!-- Expenses -->
        <div class="col-md-4">
          <div class="card overview-card">
            <div class="card-body d-flex align-items-center">
              <img
                src="./images/spending.png"
                alt="Expenses"
                class="overview-icon me-3"
              />
              <div>
                <p class="card-text mb-1">Expenses</p>
                <h3 id="totalExpenses" class="card-title"></h3>
              </div>
            </div>
          </div>
        </div>

        <!-- Monthly Income -->
        <div class="col-md-4">
          <div class="card overview-card">
            <div class="card-body d-flex align-items-center">
              <img
                src="./images/income.png"
                alt="Income"
                class="overview-icon me-3"
              />
              <div>
                <p class="card-text mb-1">Monthly Income</p>
                <h3 id="income" class="card-title"></h3>
              </div>
            </div>
          </div>
        </div>

        <!-- Balance -->
        <div class="col-md-4">
          <div class="card overview-card">
            <div class="card-body d-flex align-items-center">
              <img
                src="./images/balance.png"
                alt="Balance"
                class="overview-icon me-3"
              />
              <div>
                <p class="card-text mb-1">Balance</p>
                <h3 id="balance" class="card-title"></h3>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============== Summary + Details ============== -->
      <div class="row">
        <!-- Expense Summary -->
        <div class="col-md-4">
          <h2 class="section-title">Expense Summary</h2>
          <table id="expense-summary" class="table summary-table">
            <thead>
              <tr>
                <th>EXPENSE CATEGORY</th>
                <th>%</th>
              </tr>
            </thead>
            <tbody>
              <!-- renderExpenseSummary() -->
            </tbody>
          </table>
        </div>

        <!-- Expense Details -->
        <div class="col-md-8">
          <h2 class="section-title">Expense Details</h2>
          <table id="expenseTable" class="table details-table">
            <thead>
              <tr>
                <th>DATE</th>
                <th>DESCRIPTION</th>
                <th>AMOUNT</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <!-- renderExpenseData() -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- ===================== Expense Modal ===================== -->
    <div
      class="modal fade"
      id="expenseModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Add Expense</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="expenseForm">
              <div class="form-group mb-3">
                <label for="date">Date</label>
                <input type="date" class="form-control" id="date" />
              </div>

              <div class="form-group mb-3">
                <label for="category">Category</label>
                <select class="form-control" id="category">
                  <option value="">--Select Category--</option>
                </select>
              </div>

              <div class="form-group mb-3">
                <label for="description">Description</label>
                <input
                  type="text"
                  class="form-control"
                  id="description"
                  placeholder="Enter description"
                />
              </div>

              <div class="form-group">
                <label for="amount">Amount</label>
                <input
                  type="number"
                  class="form-control"
                  id="amount"
                  placeholder="Enter amount"
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="expense-submit-btn"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== Delete Confirmation Modal ===================== -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Delete Expense</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body text-center">
            <p class="mb-0">Are you sure you want to delete this expense?</p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="deleteExpenseBtn">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== Scripts ===================== -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
